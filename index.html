<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pixel Vibe">
<title>Pixel Vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=0.5.0">
</head>
<body>
<canvas id="screen" aria-label="Pixel Vibe game screen"></canvas>

<div id="start" class="overlay">
  <h1>PIXEL<br>VIBE</h1>
  <button id="startBtn" class="btn" type="button" disabled>LOADING…</button>
  <p class="hint">Drag above a cannon to aim it.<br>Hold a key to raise its shield.<br>Shoot the ships before they wreck your blocks.</p>
  <p class="credit">Drums: TR-808 by Michael Fischer.<br>Instruments: FluidR3 GM (CC BY 3.0) via gleitz.</p>
</div>

<div id="banner" aria-live="polite"></div>

<div id="end" class="overlay" hidden>
  <h2>GAME OVER</h2>
  <button id="againBtn" class="btn" type="button">PLAY AGAIN</button>
  <button id="menuBtn" class="btn alt" type="button">MENU</button>
</div>

<button id="pauseBtn" type="button" aria-label="Pause" hidden>II</button>

<div id="pause" class="overlay" hidden>
  <h2>PAUSED</h2>
  <button id="resumeBtn" class="btn" type="button">RESUME</button>
  <button id="restartBtn" class="btn alt" type="button">RESTART</button>
  <button id="quitBtn" class="btn alt" type="button">QUIT</button>
</div>

<footer id="ver">v0.5.0</footer>
<script type="module" src="js/game.js?v=0.5.0"></script>
</body>
</html>
